[platformio]
default_envs = nodemcuv2_headless

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit GFX Library @ ^1.11.11
  adafruit/Adafruit SSD1306 @ ^2.5.11
  bblanchon/ArduinoJson @ ^7.0.4
build_flags =
  -D SERIAL_BAUD=115200

; NOTE:
; Replace platform/board with your exact WICED Feather target when known.
; This default environment is a placeholder so the project has a working base structure.
[env:feather_generic]
platform = atmelsam
board = adafruit_feather_m0
; Stable local port mapping (adjust if Windows reassigns COM numbers)
upload_port = COM7
monitor_port = COM8
upload_flags =
  --port=COM7
  --info
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no

[env:nodemcuv2_headless]
platform = espressif8266
board = nodemcuv2
upload_speed = 115200
monitor_speed = 115200
build_flags =
  ${env.build_flags}
  -D DISABLE_OLED=1
